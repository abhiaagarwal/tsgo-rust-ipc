[workspace]
members = [
    "crates/tsgo-decoder",
    "crates/tsgo-vfs",
    "crates/tsgo-transport",
    "crates/tsgo-client",
    "crates/tsgo-rust-ipc",
    "crates/typescript-ast-definitions",
    "tests",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
authors = ["Abhi Agarwal <abhiaagarwal01@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/abhiaagarwal/tsgo-rust-ipc"

[workspace.dependencies]
hex = "0.4.3"
rmp = "0.8.15"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
byteorder = "1.5.0"
dashmap = "6.1.0"
async-trait = "0.1.89"
bitflags = "2.10"

rstest = "0.26.1"
similar-asserts = "1.6"

tsgo-decoder = { path = "crates/tsgo-decoder" }
tsgo-vfs = { path = "crates/tsgo-vfs" }
tsgo-transport = { path = "crates/tsgo-transport" }
typescript-ast-definitions = { path = "crates/typescript-ast-definitions" }

[profile.dev.package]
similar.opt-level = 3
