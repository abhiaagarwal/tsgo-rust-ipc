name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          cache-on-failure: true
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

  unit-test:
    name: Unit Tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # windows is disabled until we can fix the line ending issues
      # - name: Enable long paths on Windows and disable auto-crlf
      #   if: runner.os == 'Windows'
      #   run: |
      #     git config --system core.longpaths true
      #     git config --system core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          cache-on-failure: true
      - name: Run unit tests
        run: cargo test --verbose --all-features --workspace --exclude tsgo-rust-ipc-integration-tests

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          cache-on-failure: true

      - name: Get tsgo submodule commit hash
        id: tsgo-hash
        run: echo "hash=$(git rev-parse HEAD:tsgo)" >> $GITHUB_OUTPUT

      - name: Cache tsgo built directory
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: cache-tsgo
        with:
          path: tsgo/built/local/
          key: tsgo-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.tsgo-hash.outputs.hash }}

      - name: Setup Node.js
        if: steps.cache-tsgo.outputs.cache-hit != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tsgo/package-lock.json

      - name: Setup Go
        if: steps.cache-tsgo.outputs.cache-hit != 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: tsgo/go.mod
          cache-dependency-path: |
            tsgo/go.sum

      - name: Install Node.js dependencies for tsgo
        if: steps.cache-tsgo.outputs.cache-hit != 'true'
        working-directory: tsgo
        run: npm ci

      - name: Build tsgo binary
        if: steps.cache-tsgo.outputs.cache-hit != 'true'
        working-directory: tsgo
        run: npx hereby build

      - name: Verify tsgo binary
        run: ./tsgo/built/local/tsgo --version

      - name: Run integration tests
        run: cargo test --verbose --all-features -p tsgo-rust-ipc-integration-tests
        env:
          TSGO_PATH: ./tsgo/built/local/tsgo

