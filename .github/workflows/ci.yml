name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          cache-on-failure: true
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

  unit-test:
    name: Unit Tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # windows is disabled until we can fix the line ending issues
      # - name: Enable long paths on Windows and disable auto-crlf
      #   if: runner.os == 'Windows'
      #   run: |
      #     git config --system core.longpaths true
      #     git config --system core.autocrlf false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          cache-on-failure: true
      - name: Run unit tests
        run: cargo test --verbose --all-features --workspace --exclude tsgo-rust-ipc-integration-tests

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          cache-on-failure: true

      - name: Get tsgo submodule commit hash
        id: tsgo-hash
        run: echo "hash=$(git rev-parse HEAD:tsgo)" >> $GITHUB_OUTPUT

      - name: Cache tsgo built directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-tsgo
        with:
          path: tsgo/built/local/
          key: tsgo-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.tsgo-hash.outputs.hash }}

      - name: Setup Node.js
        if: steps.cache-tsgo.outputs.cache-hit != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tsgo/package-lock.json

      - name: Setup Go
        if: steps.cache-tsgo.outputs.cache-hit != 'true'
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: tsgo/go.mod
          cache-dependency-path: |
            tsgo/go.sum

      - name: Install Node.js dependencies for tsgo
        if: steps.cache-tsgo.outputs.cache-hit != 'true'
        working-directory: tsgo
        run: npm ci

      - name: Build tsgo binary
        if: steps.cache-tsgo.outputs.cache-hit != 'true'
        working-directory: tsgo
        run: npx hereby build

      - name: Verify tsgo binary
        run: ./tsgo/built/local/tsgo --version

      - name: Run integration tests
        run: cargo test --verbose --all-features -p tsgo-rust-ipc-integration-tests
        env:
          TSGO_PATH: ./tsgo/built/local/tsgo

